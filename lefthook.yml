commit-msg:
  commands:
    validate:
      run: node --experimental-strip-types ./scripts/validate-commits.ts --message-file {1}

pre-commit:
  parallel: false
  commands:
    oxfmt-write:
      glob: "*.{js,jsx,ts,tsx,cjs,mjs,json,yml,yaml,md}"
      exclude:
        - "packages/*/CHANGELOG.md"
      run: vp fmt {staged_files} --write
      stage_fixed: true

    oxlint-fix:
      glob: "*.{js,jsx,ts,tsx,cjs,mjs}"
      run: vp lint {staged_files} --fix
      stage_fixed: true

    typecheck:
      run: pnpm typecheck

pre-push:
  parallel: true
  commands:
    oxfmt-check:
      run: pnpm format

    oxlint:
      run: pnpm lint

    typecheck:
      run: pnpm typecheck

pre-merge-commit:
  parallel: false
  commands:
    oxlint:
      run: pnpm lint
